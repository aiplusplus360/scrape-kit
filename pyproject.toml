[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-kit"
version = "1.0.0"
description = "Polite web fetching: RFC 9309 robots.txt, per-host pacing and bounded retries. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aiplusplus360" }]
keywords = ["scraping", "robots.txt", "rfc9309", "crawler", "retry", "rate-limit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
scrapekit = "scrapekit.cli:main"

[project.urls]
Homepage = "https://github.com/aiplusplus360/scrape-kit"

[tool.setuptools]
packages = ["scrapekit"]
